<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" fill="none">
  <defs>
    <radialGradient id="thorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd000" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="250" cy="300" r="220" fill="url(#thorGlow)"/>

  <!-- Stormbreaker / Battleaxe & Hammer Blueprint Geometry -->
  <path d="M235 120 L265 120 L265 480 L235 480 Z" stroke="#c0d0e0" stroke-width="2" fill="#0d141e"/>
  
  <!-- Axe Blade Edge (Right) -->
  <path d="M265 150 C360 140 410 210 390 290 C370 330 310 335 265 320 Z" stroke="#ffd000" stroke-width="3" fill="rgba(255, 208, 0, 0.08)" filter="drop-shadow(0 0 14px #ffd000)"/>
  
  <!-- Hammer Head Block (Left) -->
  <polygon points="235,160 130,160 115,180 115,280 130,300 235,300" stroke="#00e5ff" stroke-width="3" fill="rgba(0, 229, 255, 0.06)" filter="drop-shadow(0 0 14px #00e5ff)"/>

  <!-- Asgardian Rune Triquetra Rings -->
  <circle cx="250" cy="230" r="45" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  <circle cx="250" cy="300" r="190" stroke="#ffd000" stroke-width="1" stroke-dasharray="6 8" opacity="0.45"/>

  <!-- Lightning Arcs -->
  <path d="M180 110 L210 180 L190 220 L240 260 L215 340 L270 390" stroke="#00e5ff" stroke-width="2" filter="drop-shadow(0 0 8px #00e5ff)"/>
  <path d="M320 120 L290 190 L330 230 L300 310 L340 370" stroke="#ffd000" stroke-width="2" filter="drop-shadow(0 0 8px #ffd000)"/>

  <text x="250" y="555" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#ffd000" text-anchor="middle" opacity="0.85">URU FORGED // ASGARDIAN BIFROST CONDUIT</text>
</svg>
